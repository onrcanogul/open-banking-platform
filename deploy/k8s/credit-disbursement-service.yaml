apiVersion: apps/v1
kind: Deployment
metadata:
  name: credit-disbursement-service
  namespace: obe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credit-disbursement-service
  template:
    metadata:
      labels:
        app: credit-disbursement-service
    spec:
      enableServiceLinks: false
      containers:
        - name: credit-disbursement-service
          image: obe/credit-disbursement-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: obe-common
          env:
            - name: ORACLE_BAAS_USER
              valueFrom:
                secretKeyRef:
                  name: obe-secrets
                  key: ORACLE_BAAS_USER
            - name: ORACLE_BAAS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: obe-secrets
                  key: ORACLE_BAAS_PASSWORD
            - name: OBE_COREBANKINGURL
              value: http://mock-core-banking:8086
            - name: SPRING_APPLICATION_JSON
              value: '{"obe":{"partners":{"PARTNER1":{"webhook-url":"http://mock-partner:8087/disbursement-events"}}}}'
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8085
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8085
---
apiVersion: v1
kind: Service
metadata:
  name: credit-disbursement-service
  namespace: obe
spec:
  selector:
    app: credit-disbursement-service
  ports:
    - port: 8085
