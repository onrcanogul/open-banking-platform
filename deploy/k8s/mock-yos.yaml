apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-yos
  namespace: obe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-yos
  template:
    metadata:
      labels:
        app: mock-yos
    spec:
      enableServiceLinks: false
      containers:
        - name: mock-yos
          image: obe/mock-yos:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: obe-common
          env:
            - name: OBE_HHSURL
              value: http://mock-hhs:8082
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
---
apiVersion: v1
kind: Service
metadata:
  name: mock-yos
  namespace: obe
spec:
  selector:
    app: mock-yos
  ports:
    - port: 8083
