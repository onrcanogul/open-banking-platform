server:
  port: 8085

spring:
  application:
    name: credit-disbursement-service
  config:
    # The working directory is the repo root in an IDE and the module with Maven
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: ${ORACLE_BAAS_USER}
    password: ${ORACLE_BAAS_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Timestamp columns have no zone and always hold UTC
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

obe:
  core-banking-url: http://localhost:8086
  partners:
    PARTNER1:
      max-amount: 50000.00
  saga:
    worker-enabled: true
    poll-interval: PT1S
    claim-size: 50
    # Claimed rows return to the queue after this long if the worker died
    claim-lease: PT30S

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
