server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    # The working directory is the repo root in an IDE and the module with Maven
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  security:
    oauth2:
      resourceserver:
        jwt:
          # The issuer is what tokens claim, the key address is where this gateway reaches the server
          issuer-uri: http://localhost:9000
          jwk-set-uri: ${obe.identity-server-url}/oauth2/jwks
          authorities-claim-name: roles
          authority-prefix: ROLE_
  cloud:
    gateway:
      server:
        webmvc:
          # Only what is listed here is reachable, so internal endpoints stay closed
          routes:
            - id: disbursements
              uri: ${obe.disbursement-service-url}
              predicates:
                - Path=/disbursements,/disbursements/**
            - id: operations
              uri: ${obe.disbursement-service-url}
              predicates:
                - Path=/operations/**

obe:
  disbursement-service-url: http://localhost:8085
  identity-server-url: http://localhost:9000
  ui-origin: http://localhost:5173
  partner-api-keys:
    PARTNER1: ${GATEWAY_PARTNER1_API_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
