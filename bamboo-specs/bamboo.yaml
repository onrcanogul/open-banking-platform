---
version: 2
plan:
  project-key: OBE
  key: MAIN
  name: OBE Main

repositories:
  - obe

triggers:
  - polling: 150

stages:
  - Build and Test:
      jobs:
        - Backend
        - Operations UI

Backend:
  tasks:
    - clean
    - checkout
    - script:
        interpreter: /bin/sh
        scripts:
          - sh ./mvnw -B -ntp verify
  final-tasks:
    - test-parser:
        type: junit
        test-results:
          - '**/target/surefire-reports/*.xml'

Operations UI:
  tasks:
    - clean
    - checkout
    - script:
        interpreter: /bin/sh
        scripts:
          - cd operations-ui
          - npm ci
          - npm test
          - npm run build
