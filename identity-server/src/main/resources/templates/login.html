<!doctype html>
<html lang="tr" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personel Girişi</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #eef1f4;
      color: #1f2a37;
      font: 13px/1.4 "Segoe UI", Tahoma, Arial, sans-serif;
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      height: 48px;
      padding: 0 16px;
      background: #12325b;
      border-bottom: 3px solid #0c2442;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
    }
    header span {
      padding: 1px 6px;
      border: 1px solid #8fa3bd;
      color: #d5deea;
      font-size: 11px;
      font-weight: 400;
    }
    main {
      width: 360px;
      max-width: calc(100vw - 32px);
      margin: 80px auto 0;
      background: #fff;
      border: 1px solid #c8d0da;
    }
    h1 {
      margin: 0;
      padding: 8px 16px;
      background: #e8ecf1;
      border-bottom: 1px solid #c8d0da;
      color: #12325b;
      font-size: 14px;
      font-weight: 600;
    }
    form { padding: 16px; }
    label { display: block; margin-bottom: 12px; font-weight: 600; }
    input[type="text"], input[type="password"] {
      display: block;
      width: 100%;
      margin-top: 4px;
      padding: 5px 8px;
      border: 1px solid #9aa7b6;
      border-radius: 2px;
      font: inherit;
      font-weight: 400;
    }
    input:focus-visible, button:focus-visible { outline: 2px solid #3b7bc8; outline-offset: 1px; }
    button {
      width: 100%;
      padding: 6px 12px;
      background: #12325b;
      border: 1px solid #0c2442;
      border-radius: 2px;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }
    button:hover { background: #0c2442; }
    .message {
      margin-bottom: 12px;
      padding: 8px 12px;
      background: #fae8e8;
      border-left: 3px solid #a32020;
      color: #a32020;
    }
    footer {
      padding: 8px 16px;
      background: #f7f8fa;
      border-top: 1px solid #c8d0da;
      color: #5a6778;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <header>Operasyon Paneli <span>TEST ORTAMI</span></header>
  <main>
    <h1>Personel Girişi</h1>
    <form th:action="@{/login}" method="post">
      <div class="message" role="alert" th:if="${param.error}">Kullanıcı adı veya şifre hatalı.</div>
      <label>Kullanıcı Adı
        <input type="text" name="username" autocomplete="username" required autofocus>
      </label>
      <label>Şifre
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Giriş Yap</button>
    </form>
    <footer>Bu sistem yalnızca yetkili personel içindir.</footer>
  </main>
</body>
</html>
