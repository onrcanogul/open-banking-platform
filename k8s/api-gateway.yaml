apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: obe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      enableServiceLinks: false
      containers:
        - name: api-gateway
          image: obe/api-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: obe-common
          env:
            - name: GATEWAY_PARTNER1_API_KEY
              valueFrom:
                secretKeyRef:
                  name: obe-secrets
                  key: GATEWAY_PARTNER1_API_KEY
            - name: OBE_DISBURSEMENTSERVICEURL
              value: http://credit-disbursement-service:8085
            - name: OBE_IDENTITYSERVERURL
              value: http://identity-server:9000
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: obe
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 8080
