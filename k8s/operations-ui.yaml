apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-ui
  namespace: obe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operations-ui
  template:
    metadata:
      labels:
        app: operations-ui
    spec:
      enableServiceLinks: false
      containers:
        - name: operations-ui
          image: obe/operations-ui:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: operations-ui
  namespace: obe
spec:
  type: LoadBalancer
  selector:
    app: operations-ui
  ports:
    # The identity server only redirects to this port
    - port: 5173
      targetPort: 8080
