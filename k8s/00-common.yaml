apiVersion: v1
kind: Namespace
metadata:
  name: obe
---
# Oracle, Kafka and Redis stay in Compose, outside the cluster
apiVersion: v1
kind: ConfigMap
metadata:
  name: obe-common
  namespace: obe
data:
  SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//host.docker.internal:1521/FREEPDB1
  SPRING_KAFKA_BOOTSTRAPSERVERS: host.docker.internal:9094
  SPRING_DATA_REDIS_HOST: host.docker.internal
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
