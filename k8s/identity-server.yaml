apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-server
  namespace: obe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: identity-server
  template:
    metadata:
      labels:
        app: identity-server
    spec:
      enableServiceLinks: false
      containers:
        - name: identity-server
          image: obe/identity-server:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9000
          envFrom:
            - configMapRef:
                name: obe-common
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: obe-secrets
                  key: REDIS_PASSWORD
            - name: IDENTITY_VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: obe-secrets
                  key: IDENTITY_VIEWER_PASSWORD
            - name: IDENTITY_RECONCILER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: obe-secrets
                  key: IDENTITY_RECONCILER_PASSWORD
            - name: IDENTITY_SIGNING_KEY
              valueFrom:
                secretKeyRef:
                  name: obe-secrets
                  key: IDENTITY_SIGNING_KEY
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9000
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 9000
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: identity-server
  namespace: obe
spec:
  type: LoadBalancer
  selector:
    app: identity-server
  ports:
    - port: 9000
