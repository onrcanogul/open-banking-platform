apiVersion: apps/v1
kind: Deployment
metadata:
  name: subscription-service
  namespace: obe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: subscription-service
  template:
    metadata:
      labels:
        app: subscription-service
    spec:
      enableServiceLinks: false
      containers:
        - name: subscription-service
          image: obe/subscription-service:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: obe-common
          env:
            - name: ORACLE_APP_USER
              valueFrom:
                secretKeyRef:
                  name: obe-secrets
                  key: ORACLE_APP_USER
            - name: ORACLE_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: obe-secrets
                  key: ORACLE_APP_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: obe-secrets
                  key: REDIS_PASSWORD
            - name: OBE_EVENTDISPATCHERURL
              value: http://event-dispatcher:8084
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: subscription-service
  namespace: obe
spec:
  selector:
    app: subscription-service
  ports:
    - port: 8081
