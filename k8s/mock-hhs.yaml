apiVersion: apps/v1
kind: Deployment
metadata:
  name: mock-hhs
  namespace: obe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mock-hhs
  template:
    metadata:
      labels:
        app: mock-hhs
    spec:
      enableServiceLinks: false
      containers:
        - name: mock-hhs
          image: obe/mock-hhs:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: obe-common
          env:
            - name: ORACLE_HHS_USER
              valueFrom:
                secretKeyRef:
                  name: obe-secrets
                  key: ORACLE_HHS_USER
            - name: ORACLE_HHS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: obe-secrets
                  key: ORACLE_HHS_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 300Mi
            limits:
              memory: 512Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: mock-hhs
  namespace: obe
spec:
  selector:
    app: mock-hhs
  ports:
    - port: 8082
