server:
  port: 8085

spring:
  application:
    name: credit-disbursement-service
  config:
    # The working directory is the repo root in an IDE and the module with Maven
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties]"
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: ${ORACLE_BAAS_USER}
    password: ${ORACLE_BAAS_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      # Timestamp columns have no zone and always hold UTC
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  batch:
    job:
      # Jobs start on their schedule, not when the service starts
      enabled: false
    jdbc:
      # Flyway owns the tables
      initialize-schema: never
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
        # Fails within the publisher's wait so a broker outage cannot hold the transaction open
        max.block.ms: 5000
        request.timeout.ms: 5000
        delivery.timeout.ms: 10000
    consumer:
      group-id: partner-notifier
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        # An unreadable message becomes a logged error instead of blocking the partition forever
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.value.default.type: dev.obe.contract.event.DisbursementEvent
        spring.json.use.type.headers: false
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000

obe:
  core-banking-url: http://localhost:8086
  partners:
    PARTNER1:
      max-amount: 50000.00
      webhook-url: http://localhost:8087/disbursement-events
  outbox:
    relay-enabled: true
    poll-interval: PT1S
    batch-size: 100
    # Longer than delivery.timeout.ms, so the broker client reports the real failure first
    send-timeout: PT15S
  reconciliation:
    scheduler-enabled: true
    cron: "0 30 23 * * *"
    chunk-size: 100
    # Each run looks this far back, so a day missed by a failed run is still covered
    look-back: P2D
    # An uncertain row younger than this is still being worked on by the saga
    uncertain-age: PT1H
  notification:
    redelivery-interval: PT5S
    connect-timeout: PT2S
    read-timeout: PT5S
  saga:
    worker-enabled: true
    poll-interval: PT1S
    claim-size: 50
    # Claimed rows return to the queue after this long if the worker died
    claim-lease: PT30S

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
