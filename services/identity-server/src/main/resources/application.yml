server:
  port: 9000

spring:
  application:
    name: identity-server
  config:
    # The working directory is the repo root in an IDE and the module with Maven
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties]"
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
  security:
    oauth2:
      authorizationserver:
        issuer: http://localhost:9000
        client:
          operations-ui:
            registration:
              client-id: operations-ui
              # A browser application cannot keep a secret, so PKCE protects the code instead
              client-authentication-methods: none
              authorization-grant-types: authorization_code
              redirect-uris: http://localhost:5173/callback
              post-logout-redirect-uris: http://localhost:5173/
              scopes: openid, profile
            require-proof-key: true
            token:
              access-token-time-to-live: PT15M

obe:
  ui-origin: http://localhost:5173
  signing-key: ${IDENTITY_SIGNING_KEY}
  authorization-time-to-live: PT1H
  users:
    viewer:
      password: ${IDENTITY_VIEWER_PASSWORD}
      roles: VIEWER
    reconciler:
      password: ${IDENTITY_RECONCILER_PASSWORD}
      roles: VIEWER, RECONCILER

management:
  endpoints:
    web:
      exposure:
        include: health
