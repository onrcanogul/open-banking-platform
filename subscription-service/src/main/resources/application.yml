server:
  port: 8081

spring:
  application:
    name: subscription-service
  config:
    # The working directory is the repo root in an IDE and the module with Maven
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: ${ORACLE_APP_USER}
    password: ${ORACLE_APP_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
